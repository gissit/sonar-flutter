name: Release

on:
  push:
    tags:
      - 0.*
  # Same release, launched by hand: the button covers the case where a tag
  # cannot be pushed (some proxies pass branches and drop tags). The upload
  # action creates the tag and the release itself when they do not exist.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.5.3
        required: true

# The upload step writes a tag and a release; recent repositories hand the
# GITHUB_TOKEN read-only defaults, where that write fails with a 403.
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Resolve version
        id: ver
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 1.11
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
          check-latest: true
          cache: 'maven'

      - name: Set version
        run: mvn versions:set -DnewVersion=${{ steps.ver.outputs.version }}

      - name: Build
        run: mvn -B package --file pom.xml

      # The upstream workflow analyzed against insideapp-oss's SonarCloud here.
      # Secrets do not follow a fork, so that step failed before the upload and
      # took the release with it. This fork releases without analyzing itself.

      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{github.workspace}}/sonar-flutter-plugin/target/*.jar
          tag: ${{ steps.ver.outputs.version }}
          overwrite: true
          file_glob: true
